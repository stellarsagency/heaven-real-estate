<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C5A55A"/>
      <stop offset="50%" style="stop-color:#D4B96E"/>
      <stop offset="100%" style="stop-color:#C5A55A"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="450" fill="none"/>
  
  <!-- Building Icon -->
  <g transform="translate(200, 120)">
    <!-- Left building -->
    <rect x="-60" y="-60" width="35" height="120" rx="3" fill="url(#gold)"/>
    <!-- Center tall building -->
    <rect x="-15" y="-90" width="30" height="150" rx="3" fill="#1a1a1a"/>
    <!-- Right building -->
    <rect x="25" y="-50" width="35" height="110" rx="3" fill="url(#gold)"/>
    
    <!-- Windows left -->
    <rect x="-52" y="-50" width="8" height="10" rx="1" fill="#1a1a1a" opacity="0.5"/>
    <rect x="-40" y="-50" width="8" height="10" rx="1" fill="#1a1a1a" opacity="0.5"/>
    <rect x="-52" y="-35" width="8" height="10" rx="1" fill="#1a1a1a" opacity="0.5"/>
    <rect x="-40" y="-35" width="8" height="10" rx="1" fill="#1a1a1a" opacity="0.5"/>
    <rect x="-52" y="-20" width="8" height="10" rx="1" fill="#1a1a1a" opacity="0.5"/>
    <rect x="-40" y="-20" width="8" height="10" rx="1" fill="#1a1a1a" opacity="0.5"/>
    
    <!-- Windows center -->
    <rect x="-8" y="-80" width="6" height="8" rx="1" fill="url(#gold)" opacity="0.6"/>
    <rect x="2" y="-80" width="6" height="8" rx="1" fill="url(#gold)" opacity="0.6"/>
    <rect x="-8" y="-68" width="6" height="8" rx="1" fill="url(#gold)" opacity="0.6"/>
    <rect x="2" y="-68" width="6" height="8" rx="1" fill="url(#gold)" opacity="0.6"/>
    <rect x="-8" y="-56" width="6" height="8" rx="1" fill="url(#gold)" opacity="0.6"/>
    <rect x="2" y="-56" width="6" height="8" rx="1" fill="url(#gold)" opacity="0.6"/>
    <rect x="-8" y="-44" width="6" height="8" rx="1" fill="url(#gold)" opacity="0.6"/>
    <rect x="2" y="-44" width="6" height="8" rx="1" fill="url(#gold)" opacity="0.6"/>
    
    <!-- Windows right -->
    <rect x="33" y="-40" width="8" height="10" rx="1" fill="#1a1a1a" opacity="0.5"/>
    <rect x="45" y="-40" width="8" height="10" rx="1" fill="#1a1a1a" opacity="0.5"/>
    <rect x="33" y="-25" width="8" height="10" rx="1" fill="#1a1a1a" opacity="0.5"/>
    <rect x="45" y="-25" width="8" height="10" rx="1" fill="#1a1a1a" opacity="0.5"/>
    <rect x="33" y="-10" width="8" height="10" rx="1" fill="#1a1a1a" opacity="0.5"/>
    <rect x="45" y="-10" width="8" height="10" rx="1" fill="#1a1a1a" opacity="0.5"/>
    
    <!-- Base -->
    <rect x="-70" y="55" width="140" height="8" rx="2" fill="url(#gold)"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#1a1a1a" letter-spacing="8">HEAVEN</text>
  
  <!-- Decorative lines -->
  <line x1="100" y1="225" x2="170" y2="225" stroke="url(#gold)" stroke-width="1.5"/>
  <line x1="230" y1="225" x2="300" y2="225" stroke="url(#gold)" stroke-width="1.5"/>
  
  <text x="200" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="url(#gold)" letter-spacing="5" font-weight="500">ESTATE &amp; BUILDER</text>
</svg>
